name: ${PRODUCTION_PROJECT_NAME:-gemukore-production}

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://gemukore_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-gemukore}?schema=public
  BETTER_AUTH_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT}
  S3_REGION: ${S3_REGION:-garage}
  S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
  IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
  ACCESSORY_METADATA_PROVIDER: ${ACCESSORY_METADATA_PROVIDER:-none}
  WIKIDATA_USER_AGENT: ${WIKIDATA_USER_AGENT:-}

x-operations: &operations
  image: ${GEMUKORE_OPERATIONS_IMAGE:-gemukore-operations:production}
  build:
    context: .
    dockerfile: docker/app/Dockerfile
    target: operations
  init: true
  environment:
    <<: *app-environment
    DATABASE_URL: postgresql://gemukore_migrator:${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-gemukore}?schema=public
  networks: [backend, edge]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-garage: &garage
  image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
  entrypoint: [/garage]
  command: [server]
  restart: unless-stopped
  environment:
    GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET}
    GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Set GARAGE_ADMIN_TOKEN}
  volumes:
    - ./docker/garage/garage.toml:/etc/garage.toml:ro
  networks: [backend]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  healthcheck:
    test: [CMD, /garage, status]
    interval: 10s
    timeout: 5s
    start_period: 15s
    retries: 12

services:
  proxy:
    image: caddy:2.11.2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN:-storage.example.invalid}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "${PROXY_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${PROXY_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/proxy/routes.caddy:/etc/caddy/routes.caddy:ro
      - proxy_data:/data
      - proxy_config:/config
    networks:
      edge:
        aliases: ["${STORAGE_DOMAIN:-storage.example.invalid}"]
      backend: {}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  app:
    image: ${GEMUKORE_IMAGE:-gemukore:production}
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    environment: *app-environment
    networks: [backend, edge]
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1700,size=256m
      - /app/.next/cache:uid=1000,gid=1000,mode=1700,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully

  migrate:
    <<: *operations
    entrypoint:
      [node, --conditions=react-server, --import, tsx, docker/app/migrate.mjs]
    depends_on:
      postgres:
        condition: service_healthy

  operations:
    <<: *operations
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ${POSTGRES_DB:-gemukore}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/production-init.sh:/docker-entrypoint-initdb.d/10-gemukore.sh:ro
    networks: [backend]
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12

  garage1:
    <<: *garage
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage1_data:/var/lib/garage
  garage2:
    <<: *garage
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage2_data:/var/lib/garage
  garage3:
    <<: *garage
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage3_data:/var/lib/garage

  storage-init:
    <<: *operations
    entrypoint: [node, docker/garage/setup.mjs]
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Set GARAGE_ADMIN_TOKEN}
      GARAGE_NODE_CAPACITY: ${GARAGE_NODE_CAPACITY:-10737418240}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
    networks: [backend]
    depends_on:
      garage1: { condition: service_healthy }
      garage2: { condition: service_healthy }
      garage3: { condition: service_healthy }

networks:
  edge: {}
  backend:
    internal: true

volumes:
  postgres_data:
    external: true
    name: ${PRODUCTION_VOLUME_PREFIX:-gemukore-production}-postgres
  garage1_data:
    external: true
    name: ${PRODUCTION_VOLUME_PREFIX:-gemukore-production}-garage1
  garage2_data:
    external: true
    name: ${PRODUCTION_VOLUME_PREFIX:-gemukore-production}-garage2
  garage3_data:
    external: true
    name: ${PRODUCTION_VOLUME_PREFIX:-gemukore-production}-garage3
  proxy_data:
    external: true
    name: ${PRODUCTION_VOLUME_PREFIX:-gemukore-production}-proxy-data
  proxy_config:
    external: true
    name: ${PRODUCTION_VOLUME_PREFIX:-gemukore-production}-proxy-config
